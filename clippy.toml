# Tests may panic: a failed assertion is how they fail. Cargo.toml denies it everywhere else.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Names from the Office and PDF formats that doc comments use as words, not code.
doc-valid-idents = ["DrawingML", "WordprocessingML", "PowerPoint", "LastResort", "XObject", ".."]
