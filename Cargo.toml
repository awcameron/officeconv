[package]
name = "officeconv"
version = "0.2.3"
edition = "2024"
description = "Convert XLSX spreadsheets to CSV, TSV, JSON, or Markdown, and DOCX and PPTX files to Markdown"
readme = "README.md"
license = "MIT"
repository = "https://github.com/awcameron/officeconv"
keywords = ["xlsx", "docx", "pptx", "markdown", "converter"]
categories = ["command-line-utilities", "text-processing"]

# fuzz/ shares this workspace so it shares Cargo.lock: the fuzzer builds against exactly the
# dependency versions that ship, and `cargo deny` checks its own. Commands run here without
# `--workspace` still cover only officeconv.
[workspace]
members = [".", "fuzz"]

[dependencies]
calamine = "0.36.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"], optional = true }
fontdb = { version = "0.24.0", optional = true }
imagesize = { version = "0.14.0", optional = true }
krilla = { version = "0.8.2", optional = true }
quick-xml = "0.42.0"
rustybuzz = { version = "0.20", optional = true }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
unicode-linebreak = { version = "0.1.5", optional = true }
unicode-normalization = "0.1.25"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = ["pdf"]
# `--to pdf`. Without it the binary is smaller, and `--to pdf` says it isn't built in.
pdf = [
    "dep:flate2",
    "dep:fontdb",
    "dep:imagesize",
    "dep:krilla",
    "dep:rustybuzz",
    "dep:unicode-linebreak",
]

[dev-dependencies]
assert_cmd = "2.2.2"
pdf-extract = "0.12.1"
predicates = "3.1.4"
rust_xlsxwriter = "0.99.1"
tempfile = "3.27.0"

[build-dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

# Smaller release binaries: no debug symbols, and whole-program optimization. This makes
# release builds slower, but not debug builds or `cargo test`.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
