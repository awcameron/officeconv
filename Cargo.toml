[package]
name = "officeconv"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = "0.36.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
quick-xml = "0.42.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rust_xlsxwriter = "0.99.1"
tempfile = "3.27.0"
