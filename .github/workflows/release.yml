name: Release

# Merging a change to `version` in Cargo.toml publishes a GitHub Release, tagged vX.Y.Z on the
# merge commit, with a binary for each platform. A push to main whose version already has a
# tag, such as a dependency update, publishes nothing. PRs that change this file build every
# platform without publishing anything.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  pull_request:
    paths: [.github/workflows/release.yml]

# Runs on main wait for each other, so two merges can't both see a tag missing and both try to
# release it. A new push to a PR cancels that PR's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      # vX.Y.Z when this push should release it, otherwise empty.
      tag: ${{ steps.version.outputs.tag }}
      toolchain: ${{ steps.toolchain.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Releases build with the exact version in rust-version, not whatever stable is that day,
      # so the same commit always builds the same way. CI's msrv job tests that version too.
      - name: Toolchain from Cargo.toml
        id: toolchain
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Version to release
        id: version
        if: github.event_name == 'push'
        # An existing tag is left alone, never moved: the "release tags" ruleset also blocks
        # moving or deleting v* tags.
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "officeconv") | .version')
          tag="v$version"
          # --exit-code exits with 2 when nothing matches. Any other failure, such as a
          # network error, stops the run rather than being taken to mean "no tag".
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || rc=$?
          case $rc in
            0) echo "$tag is already tagged, so there's nothing to release" ;;
            2) echo "releasing $tag"; echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      - name: Test
        run: cargo test --locked

  create-release:
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Creates the tag too, on the commit this run tested. A tag created with GITHUB_TOKEN
      # doesn't start other workflows, so the binaries are built by the job below.
      - name: Create release
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}

  upload:
    needs: [check, create-release]
    # Runs on PRs too, where create-release is skipped, to check that every platform builds.
    if: >-
      !failure() && !cancelled()
      && (github.event_name == 'pull_request' || needs.check.outputs.tag != '')
    runs-on: ${{ matrix.os }}
    # Job permissions replace the workflow's, so contents: write (uploading) is repeated here.
    # id-token and attestations let the attest step sign with a short-lived Sigstore
    # certificate and store the attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      # One platform failing leaves the others to finish, so "Re-run failed jobs" repeats only
      # that one.
      fail-fast: false
      matrix:
        include:
          # Linux builds run in cross containers, so the binaries need an old glibc (2.17)
          # rather than whatever the runner's Ubuntu has, and run on older distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            build-tool: cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            build-tool: cross
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ needs.check.outputs.toolchain }}
          targets: ${{ matrix.target }}

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        id: upload
        with:
          bin: officeconv
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          # No version in the name, so releases/latest/download/<name> always gets the newest
          # release. A link to one version names its tag in the path instead.
          archive: $bin-$target
          # The Noto Sans licence has to travel with the fonts built into the binary.
          include: LICENSE,README.md,assets/fonts/OFL.txt
          checksum: sha256
          locked: true
          # The run is on main, not the tag, so name the tag. Empty on PRs, which don't use it.
          ref: ${{ needs.check.outputs.tag && format('refs/tags/{0}', needs.check.outputs.tag) || '' }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          dry-run-intended: true
          token: ${{ github.token }}

      # Records, signed through Sigstore, that this workflow built the archive from this commit,
      # so `gh attestation verify` can check a download came from here and not just that it
      # matches a checksum on the same page. Only on releases: PR builds aren't published.
      - name: Attest the archive
        if: needs.check.outputs.tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}
