# `cargo deny check`, run in CI. officeconv reads untrusted files (see SECURITY.md), so the
# crates that parse them are checked for known vulnerabilities, along with their licenses and
# where they come from.

[graph]
all-features = true

[advisories]
# Fails on any advisory for a crate in Cargo.lock, including unmaintained and yanked crates.
# To accept one, add its ID here with the reason.
ignore = [
    # ttf-parser is unmaintained, with no known vulnerability. It's only in the tests, through
    # pdf-extract's lopdf (0.12.1 is the latest), and never in the binary.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: dev-only, via pdf-extract; #76" },
]

[licenses]
# Permissive licenses only, so the MIT binary can be shared without extra conditions.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# fuzz/ depends on officeconv by path alone. It isn't published, so that's fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
