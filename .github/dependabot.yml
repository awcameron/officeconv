version: 2
updates:
  # Workflows pin actions to commit SHAs; this opens a PR when an action releases a new version,
  # updating the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The contributor image's base is pinned by digest; this keeps the digest current. Its Rust
  # version must stay at rust-version, so only digest and patch updates are opened, and a patch
  # update fails the Dev container workflow until rust-version matches it.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    ignore:
      - dependency-name: rust
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: chore
