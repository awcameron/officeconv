name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's older run. Every other run gets its own group, so a run
# on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same checks as the first six in scripts/check.sh, kept as separate steps so a failure's
  # log is easy to find. Change both together.
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: cargo test --locked
      - name: Lint without PDF
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Test without PDF
        run: cargo test --locked --no-default-features

  # The tests with the exact version in Cargo.toml's rust-version, the oldest Rust officeconv
  # claims to build with and the one releases build with. A dependency update that needs a newer
  # Rust fails here instead of quietly raising the minimum.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from Cargo.toml
        id: toolchain
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The contributor image (.devcontainer/) has to build with the same Rust. A Dependabot
      # update to its base image, or a change to rust-version, fails here until the other
      # matches.
      - name: Dev container's Rust matches rust-version
        run: |
          image=$(sed -n 's/^FROM rust:\([0-9.]*\)-.*/\1/p' .devcontainer/Dockerfile)
          echo "rust-version is $VERSION; the dev container has $image"
          [ "$image" = "$VERSION" ]
        env:
          VERSION: ${{ steps.toolchain.outputs.version }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --locked
      - name: Test without PDF
        run: cargo test --locked --no-default-features

  # Known vulnerabilities, licenses and sources of every crate in Cargo.lock (see deny.toml).
  # The advisory database changes daily, so a new advisory can fail a PR that didn't touch
  # dependencies: fix it or add it to deny.toml's ignore list with the reason.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      # cargo-deny's prebuilt binary, at the version and hash the dev container pins, so the two
      # can't drift apart. cargo-deny-action built a Docker image from Docker Hub on every run,
      # and Docker Hub's rate limit for anonymous pulls failed the job.
      - name: Install cargo-deny
        run: |
          version=$(sed -n 's/^ARG CARGO_DENY_VERSION=//p' .devcontainer/Dockerfile)
          sha=$(sed -n 's/^ARG CARGO_DENY_SHA256_AMD64=//p' .devcontainer/Dockerfile)
          [ -n "$version" ] && [ -n "$sha" ] || {
            echo "no cargo-deny version or hash in .devcontainer/Dockerfile" >&2
            exit 1
          }
          deny=cargo-deny-$version-x86_64-unknown-linux-musl
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$deny.tar.gz"
          echo "$sha  $deny.tar.gz" | sha256sum -c -
          tar xzf "$deny.tar.gz" -C "$HOME/.cargo/bin" --strip-components 1 "$deny/cargo-deny"
      # Every feature's dependencies, the fuzzing feature's included, as cargo-deny-action checked.
      - name: Check dependencies
        run: cargo deny --all-features check
