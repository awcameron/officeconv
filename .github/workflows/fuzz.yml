name: Fuzz

# Fuzzes each target in fuzz/ for an hour every Monday, starting from the corpus the last run
# kept plus the seeds fuzz/make-seeds.sh writes. Each run minimizes its corpus with cargo fuzz
# cmin and saves it to the Actions cache for the next, and uploads it as an artifact named
# fuzz-corpus-<target> to fuzz locally from. A target that panics, hangs or runs out of memory
# fails its job, and the input that did it is uploaded as an artifact named fuzz-<target> to
# replay locally (see CONTRIBUTING.md#fuzzing).
# "Run workflow" fuzzes for as long as asked. PRs that change this file, the fuzz targets or the
# seeds fuzz each target for a minute, to check the workflow still runs.
on:
  schedule:
    # An hour before dev-container.yml's weekly build.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target for
        default: "3600"
  pull_request:
    paths: [.github/workflows/fuzz.yml, fuzz/**, tests/cli/seeds.rs]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Change it with CARGO_FUZZ_VERSION in .devcontainer/Dockerfile. It's compiled, not
  # downloaded: the prebuilt binary is a musl build, and cargo-fuzz builds the targets for the
  # target it was built for.
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [archive, delimited, docx, pptx, xlsx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      # One cache per target: each job builds only its own target. It keeps cargo-fuzz too, so
      # installing it again is a version check.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: cargo install --locked "cargo-fuzz@$CARGO_FUZZ_VERSION"

      # Each run saves a new entry, so this restores the newest. GitHub evicts an entry no run
      # has used for 7 days, so a week's gap is the most the schedule can leave. PRs restore
      # main's corpus but don't save their own.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # make-seeds.sh only adds files, so the seeds stay in a restored corpus.
      - name: Seeds
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "restored $(find "corpus/$TARGET" -type f 2>/dev/null | wc -l) inputs"
          ./make-seeds.sh
          echo "starting from $(find "corpus/$TARGET" -type f | wc -l) inputs"

      # From fuzz/, so fuzz/.cargo/config.toml turns off LTO and symbol stripping. -max_len is
      # what CONTRIBUTING.md suggests. -timeout makes an input that takes 25 seconds a failure
      # (a hang), instead of libFuzzer's default of 20 minutes, longer than the whole run.
      # AddressSanitizer's quarantine and allocator grow RSS by 1 to 2 GB over an hour while
      # officeconv's live heap stays small (#213), so the RSS limit is twice libFuzzer's default.
      # -malloc_limit_mb keeps that default for a single allocation, which is what catches one
      # input blowing up and saves it.
      - name: Fuzz
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'pull_request' && '60') || '3600' }}
        run: >-
          cargo +nightly fuzz run "$TARGET" --
          -max_len=65536 -timeout=25 -rss_limit_mb=4096 -malloc_limit_mb=2048
          -max_total_time="$SECONDS_PER_TARGET"

      # Keeps only the inputs that add coverage. Runs after a crash too: the crashing input is
      # in artifacts/, not the corpus, and what the run found before it is worth keeping.
      - name: Minimize the corpus
        id: cmin
        if: ${{ !cancelled() }}
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +nightly fuzz cmin "$TARGET" -- -max_len=65536 -timeout=25 -rss_limit_mb=4096 -malloc_limit_mb=2048
          files=$(find "corpus/$TARGET" -type f | wc -l)
          size=$(du -sh "corpus/$TARGET" | cut -f1)
          echo "kept $files inputs, $size"
          echo "Corpus for \`$TARGET\`: $files inputs, $size" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the corpus
        if: ${{ !cancelled() && steps.cmin.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the corpus
        if: ${{ !cancelled() && steps.cmin.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
